<style>
:root{--bg:#F3F0EA;--panel:#FFFFFF;--ink:#111111;--mute:#5E5E5E;--red:#E10600;--blue:#0A3FA8;--line:#DAD6CC;--side:#000;color-scheme:light;
--tit:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--ui:'Inter',system-ui,sans-serif;--ref:'Newsreader',Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E0E;--panel:#171717;--ink:#F3F0EA;--mute:#A8A8A8;--red:#FF2A1F;--blue:#6C93EE;--line:#2C2C2C;--side:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0E0E;--panel:#171717;--ink:#F3F0EA;--mute:#A8A8A8;--red:#FF2A1F;--blue:#6C93EE;--line:#2C2C2C;--side:#000;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--tit);font-style:italic;font-weight:800;line-height:.95;margin:0;text-transform:uppercase}
.ref{font-family:var(--ref);font-style:italic;color:var(--mute)}
.shell{display:grid;grid-template-columns:92px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--side);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;color:#F3F0EA;z-index:5}
.side .logo{width:68px;height:68px;padding:0;border:0;margin-bottom:14px}.side .logo img{width:100%;height:100%;display:block}
.side a{display:flex;flex-direction:column;align-items:center;gap:3px;width:76px;padding:9px 0;text-decoration:none;font-size:11px;text-align:center;line-height:1.15;color:#BDBDBD;border-left:3px solid transparent}
.side a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side a:hover,.side .mb:hover{color:#fff}
.side .ls,.side .mb,.side .morep,.mtop{display:none}
.side a[aria-current="page"]{color:#fff;border-color:var(--red)}
/* main grid */
.main{display:grid;grid-template-columns:1fr 360px;min-width:0}
.left{padding:28px clamp(18px,3vw,44px) 60px;min-width:0}
.right{background:var(--panel);border-left:1px solid var(--line);padding:28px 26px 60px}
/* hero */
.hero{position:relative;padding:8px 0 34px}
.dots{position:absolute;right:0;top:-10px;width:170px;height:130px;background:radial-gradient(var(--red) 28%,transparent 30%) 0 0/14px 14px;opacity:.85;-webkit-mask:linear-gradient(225deg,#000,transparent 75%);mask:linear-gradient(225deg,#000,transparent 75%)}
.ban{display:inline-block;background:#000;padding:14px 34px 12px 22px;transform:skewX(-8deg);border-bottom:4px solid var(--red);position:relative}
.ban h1{font-size:clamp(42px,7vw,84px);color:#fff;transform:skewX(8deg)}
.ban h1 em{color:var(--red);font-style:italic}
.tag{font-size:21px;margin:14px 0 6px}
.hero p{max-width:50ch;color:var(--mute);margin:8px 0 22px}
.hacts{display:flex;flex-wrap:wrap;gap:10px 12px}
@media(pointer:coarse){.hacts .btn{padding-top:14px;padding-bottom:14px}}
.hero .join{font-size:14px;line-height:1.5;max-width:46ch;margin:14px 0 0}
.btn{display:inline-block;font:600 15px var(--ui);padding:12px 22px;background:var(--red);color:#fff;border:0;text-decoration:none;cursor:pointer;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-right:30px}
.btn.k{background:var(--ink);color:var(--bg)}
.stripes{height:14px;width:110px;background:repeating-linear-gradient(115deg,var(--red) 0 6px,transparent 6px 12px);margin-top:26px}
/* sections */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 16px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sh h2{font-size:30px}
.sh a{font-size:14px;color:var(--blue);font-weight:600}
.cover{aspect-ratio:2/3;background:var(--c);color:#fff;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:6px 8px 0 rgba(0,0,0,.18)}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.22) 25%,transparent 27%) 0 0/9px 9px;-webkit-mask:linear-gradient(200deg,#000,transparent 55%);mask:linear-gradient(200deg,#000,transparent 55%)}
.cover b{font:italic 800 clamp(20px,2.4vw,26px)/.95 var(--tit);text-transform:uppercase;position:relative}
.cover i{font:italic 14px var(--ref);position:relative;opacity:.9}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:26px}
.shelf a{text-decoration:none}
.shelf strong{display:block;margin-top:12px;font-size:15px}
.meta{font-size:13px;color:var(--mute)}
.rv{display:grid;grid-template-columns:1.3fr 1fr;gap:30px}
.card{background:var(--panel);border:1px solid var(--line);padding:24px;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.q{font:italic 800 clamp(24px,3vw,34px)/1 var(--tit);text-transform:uppercase;margin:12px 0}
.stars{color:var(--red);letter-spacing:2px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list strong{display:block}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dl a{display:block;padding:18px;background:var(--ink);color:var(--bg);text-decoration:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.dl b{font:italic 800 24px/1 var(--tit);text-transform:uppercase;display:block}
.dl span{font-size:13px;opacity:.75}
/* right panel */
.cur{display:grid;grid-template-columns:110px 1fr;gap:18px}
.cur h2{font-size:34px;margin-bottom:4px}
.prog{height:6px;background:var(--line);margin:10px 0 4px}
.prog span{display:block;height:100%;background:var(--red)}
.cur p{font-size:14px;color:var(--mute);margin:12px 0}
.enc{list-style:none;margin:0;padding:0}.enc li{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.enc time{background:var(--ink);color:var(--bg);text-align:center;padding:6px 0;font:italic 700 14px/1 var(--tit);text-transform:uppercase}.enc time b{display:block;font:italic 800 32px/1 var(--tit);color:var(--red)}.enc strong{display:block}
.pg{font-size:clamp(44px,7vw,72px);margin-bottom:4px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:16px 0 6px}
.chips button{flex:0 0 auto;border:0;background:var(--line);color:var(--ink);font:600 15px var(--ui);padding:10px 20px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--red);color:#fff}
.rack{margin-bottom:22px}
.books{display:flex;align-items:flex-end;gap:clamp(10px,2.4vw,26px);padding:22px 18px 0;background:rgba(128,128,128,.1)}
.bk{flex:0 0 auto;width:clamp(72px,17vw,128px);border:0;padding:0;background:none;cursor:pointer;transition:transform .15s}
.bk:hover{transform:translateY(-6px)}
.bk .cover{box-shadow:4px 0 0 rgba(0,0,0,.3)}
.board{height:20px;background:linear-gradient(#2A2420,#0B0908);border-top:2px solid #4A4038;box-shadow:0 8px 14px rgba(0,0,0,.35)}
dialog{border:0;padding:24px;max-width:560px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dg{display:grid;grid-template-columns:120px 1fr;gap:20px}.dg h2{font-size:34px;margin-bottom:4px}.dg p{margin:10px 0}
.cover.pic{padding:0;background:#222}.cover.pic::before{display:none}.cover.pic img{width:100%;height:100%;object-fit:cover;display:block}
.bk.dsf{position:relative}.bk.dsf::after{content:"Fôlego";position:absolute;top:10px;left:-6px;background:var(--red);color:#fff;font:italic 800 13px/1 var(--tit);text-transform:uppercase;padding:4px 9px 3px}
.books.empty{min-height:110px;align-items:center;justify-content:center}
.back{display:inline-block;margin-bottom:18px;color:var(--blue);font-weight:600;text-decoration:none}
.bp{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:28px;align-items:start}
.bpc .cover{box-shadow:8px 8px 0 var(--line)}
.tagb{display:inline-block;background:var(--ink);color:var(--bg);font:600 12px var(--ui);padding:3px 10px;margin:6px 0 10px}
.rv2{display:grid;gap:18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.dc{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);padding:14px}
.dc .cover{box-shadow:3px 3px 0 rgba(0,0,0,.2)}.dc a{display:block}
.dc strong{display:block;margin:2px 0 6px;line-height:1.25}
.acts{display:flex;gap:14px;align-items:center;margin-top:8px}.acts .btn{padding:8px 24px 8px 16px}
.lk{color:var(--blue);font-weight:600;font-size:14px}
.sel{display:inline-flex;gap:8px;align-items:center;margin:6px 16px 18px 0;font-size:14px;color:var(--mute)}
.sel select{font:15px var(--ui);padding:8px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);max-width:100%}
@media(max-width:760px){.bp{grid-template-columns:1fr}.bpc{max-width:180px}}
.dgrid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}.dc{grid-template-columns:auto 1fr}.dth{display:flex;gap:6px}.dth img{width:54px;height:162px;object-fit:cover;display:block;border:1px solid var(--line)}.acts{flex-wrap:wrap}
.encl{max-width:720px;margin-top:20px}.encl li{padding:16px 0}
.side .ig{margin-top:auto}
@media(max-width:760px){.side .ig{display:none}}
#app:focus{outline:none}
.skip{position:absolute;left:-999px;top:8px;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;font-weight:600}
.skip:focus{left:8px}
@media(prefers-reduced-motion:reduce){.bk{transition:none}.bk:hover{transform:none}}
.stub{padding:70px 0;max-width:50ch}.stub h1{font-size:64px;margin-bottom:16px}
@media(max-width:1100px){.main{grid-template-columns:1fr}.right{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:760px){
.shell{grid-template-columns:1fr;align-content:start;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;display:grid;grid-template-columns:repeat(6,minmax(max-content,1fr));gap:0;padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
.side .mx,.side .lx{display:none}.side .ls{display:inline}
.side a,.side .mb{width:auto;min-width:0;min-height:58px;justify-content:center;border-left:0;border-top:3px solid transparent;font:500 11px/1.15 var(--ui);padding:7px 3px 8px;letter-spacing:0}
.side .mb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border-right:0;border-bottom:0;color:#BDBDBD;cursor:pointer;-webkit-tap-highlight-color:transparent}
.side .mb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round}
.side .mb[aria-expanded="true"],.side .mb.on{color:#fff}.side .mb.on{border-top-color:var(--red)}
.side a[aria-current="page"]{border-top-color:var(--red)}
.side .morep:not([hidden]){display:block;position:absolute;right:0;bottom:100%;width:min(260px,calc(100% - 16px));margin-right:max(8px,env(safe-area-inset-right,0px));background:var(--side);border-top:4px solid var(--red);padding:6px 0;box-shadow:0 -10px 28px rgba(0,0,0,.28)}
.side .morep a{flex-direction:row;justify-content:flex-start;gap:14px;min-height:50px;padding:0 20px;border-top:0;border-left:3px solid transparent;font:500 15px/1.2 var(--ui);color:#E6E3DC;text-align:left}
.side .morep a[aria-current="page"]{border-left-color:var(--red);color:#fff}
.mtop:not([hidden]){display:flex;align-items:center;gap:10px;padding:12px clamp(18px,3vw,44px);background:var(--side);color:#F3F0EA;text-decoration:none;font:italic 700 17px/1 var(--tit);text-transform:uppercase;letter-spacing:.01em}
.mtop img{width:30px;height:30px;display:block}.mtop b{font-weight:800;color:var(--red)}
.side .logo{display:none}.rv,.dl{grid-template-columns:1fr}.dots{width:110px}}
@media(prefers-reduced-motion:no-preference){.ban{animation:in .5s ease-out both}@keyframes in{from{opacity:0;transform:skewX(-8deg) translateX(-24px)}}}
</style>
</head>

<script>
const N=[["","Início","M3 11l9-8 9 8M5 10v10h14V10"],["leituras","Leituras","M4 4h13a3 3 0 013 3v13H7a3 3 0 01-3-3zM4 17a3 3 0 013-3h13"],["encontros","Próximos encontros","M4 6h16v14H4zM4 10h16M8 3v4M16 3v4","Encontros"],["downloads","Downloads","M12 4v11M7 11l5 5 5-5M5 20h14"],["resenhas","Resenhas","M4 5h16v11H9l-5 4z"],["membros","Membros","M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 11a2.5 2.5 0 100-5M17 15c2.5 0 4 1.7 4 4"],["sobre","Sobre o Clube","M12 3a9 9 0 100 18 9 9 0 000-18zM12 11v6M12 7.5v.5","Sobre"]];
let B=[];
const cv=b=>IMG[b.t]?`<div class="cover pic"><img src="${IMG[b.t]}" alt="Capa de ${b.t}" loading="lazy" decoding="async"></div>`:`<div class="cover" style="--c:${b.c}"><i>${b.a}</i><b>${b.t}</b></div>`;
const sh=(t,l)=>`<div class="sh"><h2>${t}</h2><a href="#${l}">Ver tudo</a></div>`;
const home=()=>`
<div class="left">
  <section class="hero"><div class="dots"></div>
    <div class="ban"><h1><em>Clube de leitura</em><br>Inconfidentes</h1></div>
    <div class="tag ref">Literatura, história e boas conversas.</div>
    <p>A leitura de novembro é O Mestre e a Margarida, de Mikhail Bulgákov. Em dezembro, o clube fecha o ano com uma dinâmica especial: a retrospectiva de 2026.</p>
    <div class="hacts"><a class="btn" href="https://ig.me/m/clubeinconfidentes" target="_blank" rel="noopener">Quero participar</a><a class="btn k" href="#livro-${slug(B[0].t)}">Ver leitura atual</a></div>
    <p class="join">Encontros presenciais em Araxá, MG. Todo mundo é <span style="white-space:nowrap">bem-vindo</span>: é só mandar uma DM no Instagram para entrar no grupo do WhatsApp.</p>
    <div class="stripes"></div>
  </section>
  ${sh("Próximas leituras","leituras")}
  <ul class="list">${BK.filter(b=>b.s=="proximas").slice(0,3).map(b=>`<li><a href="#livro-${slug(b.t)}" style="text-decoration:none"><strong>${b.t}, ${b.a}</strong><span class="meta">${b.w}</span></a></li>`).join("")}</ul>
  ${sh("Lidos recentemente","leituras")}
  <div class="shelf">${B.slice(1).map(b=>`<a href="#livro-${slug(b.t)}">${cv(b)}<strong>${b.t}</strong><span class="meta">${b.a}</span></a>`).join("")}</div>

</div>
<aside class="right">

  <a class="btn k" href="#livro-${slug(B[0].t)}">Ver o livro</a>

const about=()=>`<div class="left">
  <section class="hero"><div class="dots"></div>
    <div class="ban"><h1>Sobre o<br><em>Clube.</em></h1></div>
    <div class="tag ref">Um clube para ler, pensar e compartilhar.</div>
    <p>O Clube de Leitura Inconfidentes reúne leitores de Araxá que se encontram para discutir clássicos, história e boas conversas. A cada edição, uma obra é escolhida em conjunto, lida no ritmo do grupo e debatida em um encontro presencial.</p>
    <p class="meta">Texto provisório, para ser substituído pela história real do clube.</p>
    <div class="stripes"></div>
  </section>
  <div class="sh"><h2>Siga o clube</h2></div>
  <article class="card"><p style="margin:0 0 16px">Acompanhe o Clube de Leitura Inconfidentes no Instagram.</p><a class="btn" href="https://www.instagram.com/clubeinconfidentes/" target="_blank" rel="noopener">@clubeinconfidentes no Instagram</a></article>
  <div class="sh"><h2>O que nos move</h2></div>
  <ul class="list">
    <li><strong>Clássicos da literatura</strong><span class="meta">Obras que atravessam gerações e merecem uma leitura coletiva.</span></li>
    <li><strong>Discussões enriquecedoras</strong><span class="meta">Cada encontro é uma conversa, sem resposta certa.</span></li>
    <li><strong>Identidade mineira</strong><span class="meta">Um clube que carrega o sotaque e a memória de Minas.</span></li>
    <li><strong>Comunidade de leitores</strong><span class="meta">Quem lê junto se reconhece e volta no mês seguinte.</span></li>
    <li><strong>Cultura que inspira</strong><span class="meta">Da página para a vida, com música, história e arte.</span></li>
  </ul>
  <div class="sh"><h2>Desafio Fôlego Literário</h2></div>
  <article class="card"><p style="margin:0">Um livro por semestre, lido ao longo de vários encontros, para quem quer ir mais fundo. Até agora o clube já enfrentou Os Irmãos Karamazov, de Dostoiévski, e A História Secreta, de Donna Tartt. Em 2027, os desafios serão a trilogia O Senhor dos Anéis, de Tolkien, no 1º semestre, e Um Defeito de Cor, de Ana Maria Gonçalves, no 2º.</p></article>
  <div class="sh"><h2>Como participar</h2></div>

const slug=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const leituras=()=>`<div class="left"><h1 class="pg">Leituras</h1><div class="meta">${BK.length} livros na estante do clube</div>

function initShelf(f="todos"){
  document.querySelectorAll(".chips button").forEach(b=>{if(!b.dataset.t)b.dataset.t=b.textContent;const n=BK.filter(x=>b.dataset.f=="todos"||x.s==b.dataset.f).length;b.textContent=`${b.dataset.t} (${n})`;b.setAttribute("aria-pressed",b.dataset.f==f)});
  document.getElementById("shelves").innerHTML=GR.filter(g=>f=="todos"||f==g[0]).map(g=>{const l=BK.filter(b=>b.s==g[0]);return `<div class="sh"><h2>${g[1]}</h2></div>`+(l.length?rows(l):`<div class="rack"><div class="books empty"><span class="meta">A próxima leitura ainda não foi definida.</span></div><div class="board"></div></div>`)}).join("");
  document.querySelector(".chips").onclick=e=>{const b=e.target.closest("button");if(b)initShelf(b.dataset.f)};
}

const revCard=r=>`<article class="card"><span class="meta">${r.m} sobre <a href="#livro-${slug(r.b)}">${r.b}</a></span><h3 style="font-size:26px;margin:6px 0">${r.t}</h3><div class="stars">${"★".repeat(r.n)}${"☆".repeat(5-r.n)}</div><p style="margin:10px 0 0">${r.x}</p></article>`;
const dlCard=(d,full)=>`<article class="dc"><div class="dth">${d.th.map((u,i)=>`<img src="${u}" alt="Marca-página de ${d.b.t}, ${i?"verso":"frente"}">`).join("")}</div><div><span class="meta">${d.f}</span><strong>${full?d.n+": "+d.b.t:d.n}</strong><div class="acts"><a class="btn" href="${d.files[0]}" download>Baixar frente</a><a class="btn k" href="${d.files[1]}" download>Baixar verso</a></div>${full?`<a class="lk" href="#livro-${slug(d.b.t)}">Ver livro</a>`:""}</div></article>`;
const bookPage=b=>{const rv=R.filter(r=>r.b==b.t),st={atual:"Leitura atual",proximas:"Próxima leitura",anteriores:"Leitura anterior"}[b.s];
return `<div class="left"><a class="back" href="#leituras">Voltar às leituras</a>
<section class="bp"><div class="bpc">${cv(b)}</div><div>${b.d?`<div class="meta">${b.d}</div>`:""}<span class="tagb">${st}</span><h1 class="pg" style="font-size:clamp(36px,6vw,60px)">${b.t}</h1><div class="ref" style="font-size:22px">${b.a}</div><p>${b.i}</p>${b.e?`<ul class="list">${b.e.map(m=>`<li>${m[1]?"✓ ":""}${m[0]}, sábado</li>`).join("")}</ul>`:""}</div></section>
<div class="sh"><h2>Resenhas</h2><a href="#resenhas">Ver todas</a></div>
<div class="rv2">${rv.length?rv.map(revCard).join(""):'<p class="meta">Ainda não há resenhas deste livro.</p>'}</div>
<div class="sh"><h2>Downloads deste livro</h2><a href="#downloads">Ver todos</a></div>
<div class="dgrid">${DL.filter(d=>d.b==b).map(d=>dlCard(d,0)).join("")||'<p class="meta">Os materiais deste livro ainda não foram publicados.</p>'}</div></div>`};
const downloads=()=>`<div class="left"><h1 class="pg">Downloads</h1><div class="meta">Marca-páginas de cada leitura, com frente e verso, prontos para imprimir.</div>
<div class="chips" id="dlc"><button data-f="todos">Todos</button>${CAT.filter(c=>DL.some(d=>d.c==c[0])).map(c=>`<button data-f="${c[0]}">${c[1]}</button>`).join("")}</div>
<label class="sel">Livro <select id="dlb"><option value="">Todos os livros</option>${BK.filter(b=>MP[b.t]).map(b=>`<option value="${slug(b.t)}">${b.t}</option>`).join("")}</select></label>
<div class="dgrid" id="dgrid"></div></div>`;
function initDl(f){const sel=document.getElementById("dlb");f=f||(document.querySelector("#dlc [aria-pressed=true]")||{dataset:{}}).dataset.f||"todos";
  document.querySelectorAll("#dlc button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f==f));
  const l=DL.filter(d=>(f=="todos"||d.c==f)&&(!sel.value||slug(d.b.t)==sel.value));
  document.getElementById("dgrid").innerHTML=l.map(d=>dlCard(d,1)).join("")||'<p class="meta">Nenhum arquivo para este filtro.</p>';
  document.getElementById("dlc").onclick=e=>{const b=e.target.closest("button");if(b)initDl(b.dataset.f)};sel.onchange=()=>initDl()}
const resenhas=()=>`<div class="left"><h1 class="pg">Resenhas</h1><div class="meta">Resenhas escritas pelos membros do clube</div>
<div style="margin-top:16px"><label class="sel">Livro <select id="rb"><option value="">Todos</option>${BK.map(b=>`<option>${b.t}</option>`).join("")}</select></label><label class="sel">Integrante <select id="rm"><option value="">Todos</option>${[...new Set(R.map(r=>r.m))].map(m=>`<option>${m}</option>`).join("")}</select></label></div><div class="rv2" id="rlist"></div></div>`;
function initRev(){const b=document.getElementById("rb"),m=document.getElementById("rm");const go=()=>{const l=R.filter(r=>(!b.value||r.b==b.value)&&(!m.value||r.m==m.value));document.getElementById("rlist").innerHTML=l.map(revCard).join("")||`<p class="meta">${R.length?"Nenhuma resenha para este filtro.":"Ainda não há resenhas publicadas."}</p>`};b.onchange=m.onchange=go;go()}
